server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
    # Allow a 20 MiB file plus multipart framing; FastAPI enforces the file limit.
    client_max_body_size 25m;
    # Docker's embedded DNS; refresh the address when the API container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream$request_uri;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}
